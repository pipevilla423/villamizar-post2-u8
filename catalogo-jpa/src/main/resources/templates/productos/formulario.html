
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuevo producto</title>
</head>
<body>

<h1>Registrar producto</h1>

<form th:action="@{/productos/guardar}"
      th:object="${producto}"
      method="post">

    <div>
        <label for="nombre">Nombre:</label>
        <input type="text"
               id="nombre"
               th:field="*{nombre}"
               maxlength="120"
               required>

        <span th:if="${#fields.hasErrors('nombre')}"
              th:errors="*{nombre}"></span>
    </div>

    <br>

    <div>
        <label for="precio">Precio:</label>
        <input type="number"
               id="precio"
               th:field="*{precio}"
               min="0.01"
               step="0.01"
               required>

        <span th:if="${#fields.hasErrors('precio')}"
              th:errors="*{precio}"></span>
    </div>

    <br>

    <div>
        <label for="stock">Stock:</label>
        <input type="number"
               id="stock"
               th:field="*{stock}"
               min="0"
               required>

        <span th:if="${#fields.hasErrors('stock')}"
              th:errors="*{stock}"></span>
    </div>

    <br>

    <div>
        <label for="categoriaId">Categoría:</label>

        <select id="categoriaId"
                name="categoriaId"
                required>

            <option value="">Seleccione una categoría</option>

            <option th:each="categoria : ${categorias}"
                    th:value="${categoria.id}"
                    th:text="${categoria.nombre}">
            </option>

        </select>
    </div>

    <br>

    <button type="submit">Guardar producto</button>

    <a th:href="@{/productos}">Cancelar</a>

</form>

</body>
</html>
