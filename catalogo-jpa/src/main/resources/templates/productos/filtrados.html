
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos filtrados</title>
</head>
<body>

<h1>Productos filtrados por categoría y precio</h1>

<p>
    <strong>Categoría:</strong>
    <span th:text="${categoria.nombre}"></span>
</p>

<p>
    <strong>Precio mínimo:</strong>
    <span th:text="${minimo}"></span>
</p>

<table border="1" cellpadding="8">
    <thead>
        <tr>
            <th>ID</th>
            <th>Producto</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Categoría</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="producto : ${productos}">
            <td th:text="${producto.id}"></td>
            <td th:text="${producto.nombre}"></td>
            <td th:text="${producto.precio}"></td>
            <td th:text="${producto.stock}"></td>
            <td th:text="${producto.categoria.nombre}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="5">
                No se encontraron productos con esos criterios.
            </td>
        </tr>
    </tbody>
</table>

<p>
    <a th:href="@{/productos}">Volver a productos</a>
</p>

</body>
</html>
