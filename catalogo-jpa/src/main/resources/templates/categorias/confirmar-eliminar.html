
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmar eliminación</title>
</head>
<body>

    <h1>Confirmar eliminación</h1>

    <p>¿Está seguro de que desea eliminar esta categoría?</p>

    <p>
        <strong>Nombre:</strong>
        <span th:text="${categoria.nombre}"></span>
    </p>

    <p>
        <strong>Descripción:</strong>
        <span th:text="${categoria.descripcion}"></span>
    </p>

    <form th:action="@{/categorias/eliminar/{id}(id=${categoria.id})}"
          method="post">
        <button type="submit">Confirmar eliminación</button>
        <a th:href="@{/categorias}">Cancelar</a>
    </form>

</body>
</html>
